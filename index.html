<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canadian French Translator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Canadian French Translator</h1>

        <p class="subtitle">
            English ⇄ French (CA)
        </p>

        <div class="actions" style="margin-bottom:20px;">
            <button id="swapBtn">⇄ Swap Languages</button>
        </div>

        <div class="translator-grid">

            <div class="panel">

                <div class="panel-header">
                    <h3 id="sourceLanguage">English</h3>
                </div>

                <textarea
                    id="inputText"
                    placeholder="Enter text..."
                ></textarea>

                <div class="counter">
                    Characters: <span id="inputCount">0</span>
                </div>

            </div>

            <div class="panel">

                <div class="panel-header">
                    <h3 id="targetLanguage">French (CA)</h3>
                    <button id="copyBtn">Copy</button>
                </div>

                <textarea
                    id="outputText"
                    readonly
                    placeholder="Translation will appear here..."
                ></textarea>

                <div class="counter">
                    Characters: <span id="outputCount">0</span>
                </div>

            </div>

        </div>

        <div class="quality-card">

            <h3>Translation Settings</h3>

            <div style="margin-top:20px;">

                <label for="maxLength">
                    Maximum Output Length
                </label>

                <br><br>

                <select id="maxLength">
                    <option>Unlimited</option>
                    <option>25</option>
                    <option>50</option>
                    <option>75</option>
                    <option>100</option>
                    <option>150</option>
                </select>

            </div>

        </div>

        <div class="quality-card">

            <h3>Protected Terms</h3>

            <p>
                Words that should never be translated.
            </p>

            <textarea
                id="protectedTerms"
                style="min-height:150px;"
                placeholder="Microsoft Copilot&#10;Power BI&#10;Teams"
            ></textarea>

        </div>

        <div class="actions">
