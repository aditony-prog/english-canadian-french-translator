<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English → Canadian French Translator</title>

<style>

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#f5f6f8;
    padding:40px;
}

.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    border-radius:12px;
    padding:30px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

textarea{
    width:100%;
    min-height:180px;
    padding:12px;
    font-size:16px;
    box-sizing:border-box;
}

.controls{
    margin-top:15px;
}

input[type="number"]{
    padding:8px;
    width:120px;
}

button{
    background:#0078d4;
    color:#fff;
    border:none;
    padding:12px 24px;
    border-radius:6px;
    cursor:pointer;
    margin-right:10px;
}

.output{
    margin-top:20px;
    border:1px solid #ddd;
    background:#fafafa;
    padding:16px;
    min-height:120px;
}

.metric{
    margin-top:10px;
    font-weight:600;
}

.pass{
    color:green;
}

.fail{
    color:red;
}

.warning{
    color:#d97706;
}

</style>
</head>

<body>

<div class="container">

<h1>English → Canadian French Translator</h1>

<textarea
id="sourceText"
placeholder="Enter English text..."
oninput="updateEnglishCount()"
></textarea>

<div class="metric">
English Characters:
<span id="englishCount">0</span>
</div>

<div class="controls">

<label>
Character Limit:
</label>

<input
type="number"
id="charLimit"
value="15"
min="1"
/>

</div>

<br>

<button onclick="translateText()">
Translate
</button>

<button onclick="copyTranslation()">
Copy Translation
</button>

<div class="output" id="result">
Translation will appear here.
</div>

<div class="metric">
French Characters:
<span id="frenchCount">0</span>
</div>

<div class="metric" id="status">
Status: Waiting
</div>

</div>

<script>

function updateEnglishCount() {

    const text =
        document.getElementById("sourceText").value;

    document.getElementById("englishCount").innerText =
        text.length;
}

async function translateText() {

    const text =
        document.getElementById("sourceText").value;

    if (!text.trim()) return;

    document.getElementById("result").innerText =
        "Translating...";

    try {

        const response =
            await fetch("/api/translate", {
                method: "POST",
                headers: {
                    "Content-Type":"application/json"
                },
                body: JSON.stringify({
                    text:text
                })
            });

        const data =
            await response.json();

        document.getElementById("result").innerText =
            data.translation;

        evaluateTranslation(data.translation);

    } catch {

        document.getElementById("result").innerText =
            "Translation failed.";

    }
}

function evaluateTranslation(translatedText){

    const count =
        translatedText.length;

    const limit =
        parseInt(
            document.getElementById("charLimit").value
        );

    document.getElementById("frenchCount").innerText =
        count;

    const status =
        document.getElementById("status");

    if(count <= limit){

        status.innerHTML =
            `✅ PASS (${count}/${limit})`;

        status.className =
            "metric pass";

    } else {

        status.innerHTML =
            `❌ FAIL (${count}/${limit}) - Over by ${count-limit}`;

        status.className =
            "metric fail";
    }
}

function copyTranslation(){

    const text =
        document.getElementById("result").innerText;

    navigator.clipboard.writeText(text);

    alert("Translation copied!");
}

</script>

</body>
</html>
