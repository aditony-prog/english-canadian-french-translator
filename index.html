<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canadian French Translator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Canadian French Translator</h1>

        <p class="subtitle">
            English ⇄ French (Canada)
        </p>

        <div class="translator-grid">

            <div class="panel">

                <div class="panel-header">
                    <h3 id="sourceLanguage">English</h3>
                    <button id="copyInputBtn">Copy</button>
                </div>

                <textarea
                    id="inputText"
                    placeholder="Enter text..."
                ></textarea>

                <div class="counter">
                    Characters: <span id="inputCount">0</span>
                </div>

            </div>

            <div class="panel">

                <div class="panel-header">
                    <h3 id="targetLanguage">French (CA)</h3>
                    <button id="copyBtn">Copy</button>
                </div>

                <textarea
                    id="outputText"
                    readonly
                    placeholder="Translation will appear here..."
                ></textarea>

                <div class="counter">
                    Characters: <span id="outputCount">0</span>
                </div>

            </div>

        </div>

        <div class="actions toolbar">

            <button id="swapBtn">
                ⇄ Swap Languages
            </button>

            <button id="translateBtn">
                Translate
            </button>

            <button id="clearBtn">
                Clear Input
            </button>

        </div>

        <div class="settings-grid">

            <div class="quality-card">

                <h3>Character Limit</h3>

                <select id="maxLength">
                    <option>Unlimited</option>
                    <option>25</option>
                    <option>50</option>
                    <option>75</option>
                    <option>100</option>
                    <option>150</option>
                </select>

            </div>

            <div class="quality-card">

                <h3>Translation Confidence Score</h3>

                <div id="qualityScore">
                    --%
                </div>

                <div class="quality-bar">
                    <div class="quality-bar-fill"></div>
                </div>

                <p id="qualityLabel">
                    Awaiting Translation
                </p>

            </div>

            <div class="quality-card">

                <h3>Do Not Translate</h3>

                <textarea
                    id="protectedTerms"
                    placeholder="Microsoft Copilot&#10;Power BI&#10;Teams"
                ></textarea>

            </div>

        </div>

        <div class="footer">
            Powered by Azure AI Translator
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
