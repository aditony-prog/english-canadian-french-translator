<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English → Canadian French Translator</title>

    <style>
        body {
            font-family: Segoe UI, Arial, sans-serif;
            background: #f5f6f8;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 12px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            background: #0078d4;
            color: white;
            border: none;
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 6px;
        }

        .output {
            margin-top: 20px;
            border: 1px solid #ddd;
            padding: 16px;
            min-height: 120px;
            background: #fafafa;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>English → Canadian French Translator</h1>

    <textarea
        id="sourceText"
        placeholder="Enter English text..."
    ></textarea>

    <br>

    <button onclick="translateText()">
        Translate
    </button>

    <div class="output" id="result">
        Translation will appear here.
    </div>

</div>

<script>

async function translateText() {

    const text =
        document.getElementById('sourceText').value;

    if (!text.trim()) return;

    document.getElementById('result').innerText =
        'Translating...';

    try {

        const response = await fetch('/api/translate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                text
            })
        });

        const data = await response.json();

        document.getElementById('result').innerText =
            data.translation;

    } catch (error) {

        document.getElementById('result').innerText =
            'Translation failed.';

    }
}

</script>

</body>
</html>
