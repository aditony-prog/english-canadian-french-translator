<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADI Canadian French Translator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="header">

            <div class="logo-placeholder">
                ADI
            </div>

            <div class="header-text">

                <h1>
                    Canadian French Translator
                </h1>

                <p class="subtitle">
                    English ⇄ French (Canada)
                </p>

            </div>

        </div>

        <div class="translator-grid">

            <div class="panel">

                <div class="panel-header">

                    <h3 id="sourceLanguage">
                        English
                    </h3>

                    <button id="copyInputBtn">
                        Copy
                    </button>

                </div>

                <textarea
                    id="inputText"
                    placeholder="Enter text..."
                ></textarea>

                <div class="counter">

                    Characters:
                    <span id="inputCount">
                        0
                    </span>

                </div>

            </div>

            <div class="panel">

                <div class="panel-header">

                    <h3 id="targetLanguage">
                        French (CA)
                    </h3>

                    <button id="copyBtn">
                        Copy
                    </button>

                </div>

                <textarea
                    id="outputText"
                    readonly
                    placeholder="Translation will appear here..."
                ></textarea>

                <div class="counter">

                    Characters:
                    <span id="outputCount">
                        0
                    </span>

                </div>

            </div>

        </div>

        <div class="actions toolbar">

            <button id="swapBtn">
                ⇄ Swap Languages
            </button>

            <button id="translateBtn">
                Translate
            </button>

            <button id="clearBtn">
                Clear Input
            </button>

        </div>

        <div class="settings-grid">

            <!-- CHARACTER LIMIT CARD -->

            <div class="quality-card">

                <h3>
                    French Content Type
                </h3>

                <select id="contentType">

                    <option value="">
                        Custom
                    </option>

                    <option value="20">
                        URL (20)
                    </option>

                    <option value="15">
                        Page Title (15)
                    </option>

                    <option value="18">
                        Headline (18)
                    </option>

                    <option value="30">
                        Subhead (30)
                    </option>

                    <option value="50">
                        Meta Keywords (50)
                    </option>

                    <option value="160">
                        Meta Description (160)
                    </option>

                </select>

                <input
                    type="number"
                    id="maxLength"
                    min="1"
                    placeholder="Custom length"
                    style="
                        width:100%;
                        margin-top:10px;
                        box-sizing:border-box;
                    "
                >

            </div>

            <!-- QUALITY CARD -->

            <div class="quality-card">

                <h3>
                    Translation Confidence Score
                </h3>

                <div id="qualityScore">
                    --%
                </div>

                <div class="quality-bar">
                    <div class="quality-bar-fill"></div>
                </div>

                <p id="qualityLabel">
                    Awaiting Translation
                </p>

            </div>

            <!-- DO NOT TRANSLATE CARD -->

            <div class="quality-card">

                <h3>
                    Do Not Translate
                </h3>

                <textarea
                    id="protectedTerms"
                    placeholder="ADI&#10;LTspice&#10;MAX32690&#10;CodeFusion"
                ></textarea>

            </div>

        </div>

        <div class="footer">
            Powered by Azure AI Translator
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
