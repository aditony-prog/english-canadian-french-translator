<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADI Canadian French Translator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="header">

            <div class="logo-placeholder">
                ADI
            </div>

            <div class="header-text">
                <h1>Canadian French Translator</h1>

                <p class="subtitle">
                    English ⇄ French (Canada)
                </p>
            </div>

        </div>

        <div class="translator-grid">

            <div class="panel">

                <div class="panel-header">
                    <h3 id="sourceLanguage">English</h3>
                    <button id="copyInputBtn">Copy</button>
                </div>

                <textarea
                    id="inputText"
                    placeholder="Enter text..."
                ></textarea>

                <div class="counter">
                    Characters:
                    <span id="inputCount">0</span>
                </div>

            </div>

            <div class="panel">

                <div class="panel-header">
                    <h3 id="targetLanguage">French (CA)</h3>
                    <button id="copyBtn">Copy</button>
                </div>

                <textarea
                    id="outputText"
                    readonly
                    placeholder="Translation will appear here..."
                ></textarea>

                <div class="counter">
                    Characters:
                    <span id="outputCount">0</span>
                </div>

            </div>

        </div>

        <div class="actions toolbar">

            <button id="swapBtn">
                ⇄ Swap Languages
            </button>

            <button id="translateBtn">
                Translate
            </button>

            <button id="clearBtn">
                Clear Input
            </button>

        </div>

        <div class="settings-grid">

            <!-- MAXIMUM FRENCH OUTPUT LENGTH -->

            <div class="quality-card">

                <h3>
                    Maximum French Output Length
                </h3>

                <input
                    type="number"
                    id="maxLength"
                    min="1"
                    placeholder="Leave blank for unlimited"
                    style="
                        width:100%;
                        padding:10px;
                        border-radius:6px;
                        border:1px solid #ccc;
                        box-sizing:border-box;
                    "
                >

                <p
                    style="
                        margin-top:10px;
                        font-size:12px;
                        color:#666;
                        margin-bottom:8px;
                    "
                >
                    Enter the maximum number of characters allowed.
                </p>

                <div
                    style="
                        display:flex;
                        flex-wrap:wrap;
                        gap:4px;
                    "
                >

                    <button
                        type="button"
                        class="preset-btn"
                        data-length="20"
                    >
                        URL
                    </button>

                    <button
                        type="button"
                        class="preset-btn"
                        data-length="15"
                    >
                        Title
                    </button>

                    <button
                        type="button"
                        class="preset-btn"
                        data-length="18"
                    >
                        Headline
                    </button>

                    <button
                        type="button"
                        class="preset-btn"
                        data-length="30"
                    >
                        Subhead
                    </button>

                    <button
                        type="button"
                        class="preset-btn"
                        data-length="50"
                    >
                        Keywords
                    </button>

                    <button
                        type="button"
                        class="preset-btn"
                        data-length="160"
                    >
                        Meta Desc
                    </button>

                </div>

            </div>

            <!-- CONFIDENCE -->

            <div class="quality-card">

                <h3>Translation Confidence Score</h3>

                <div id="qualityScore">
                    --%
                </div>

                <div class="quality-bar">
                    <div class="quality-bar-fill"></div>
                </div>

                <p id="qualityLabel">
                    Awaiting Translation
                </p>

            </div>

            <!-- DO NOT TRANSLATE -->

            <div class="quality-card">

                <h3>Do Not Translate</h3>

                <textarea
                    id="protectedTerms"
                    placeholder="ADI&#10;LTspice&#10;MAX32690&#10;CodeFusion"
                ></textarea>

            </div>

        </div>

        <div class="footer">
            Powered by Azure AI Translator
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
